<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Nexas Studios</title>
  <meta name="description" content="The page you requested could not be found. Return to the Nexas Studios homepage.">
  <link rel="icon" type="image/png" href="logo-text-sqaure.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
  <style>
    :root {
      --bg: #060b15;
      --surface: rgba(16, 30, 50, 0.88);
      --line: rgba(133, 174, 209, 0.24);
      --text: #edf3ff;
      --muted: #a6bdd9;
      --brand: #2ac6c9;
      --focus: #45d1d4;
      --shadow: 0 26px 70px rgba(3, 9, 20, 0.5);
      --radius-lg: 32px;
      --radius-sm: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Manrope', sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 10% 20%, rgba(42, 198, 201, 0.12), transparent 35%), var(--bg);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .card {
      width: min(620px, 100%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 34px;
      text-align: center;
    }

    .logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      margin-bottom: 16px;
    }

    .eyebrow {
      display: inline-flex;
      margin-bottom: 14px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.74rem;
      font-weight: 800;
      color: #9fc2e3;
    }

    h1 {
      margin: 0;
      font-family: 'Sora', sans-serif;
      font-size: clamp(2rem, 6vw, 2.9rem);
      letter-spacing: -0.04em;
    }

    p {
      margin: 14px auto 0;
      max-width: 44ch;
      color: var(--muted);
      line-height: 1.65;
    }

    .actions {
      margin-top: 26px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      border-radius: 999px;
      padding: 13px 20px;
      border: 0;
      font-weight: 800;
      font: inherit;
      cursor: pointer;
      transition: 0.24s;
    }

    .button--primary {
      background: var(--brand);
      color: #fff;
    }

    .button--secondary {
      color: var(--text);
      background: rgba(20, 34, 54, 0.72);
      border: 1px solid var(--line);
    }

    .button:hover {
      transform: translateY(-2px);
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    @media (max-width: 600px) {
      .card {
        padding: 24px;
        border-radius: var(--radius-sm);
      }
    }
  </style>
</head>
<body>
  <article class="card">
    <img class="logo" src="logo-text-sqaure-transparent.png" alt="Nexas Studios logo">
    <span class="eyebrow">404 Error</span>
    <h1>Page not found</h1>
    <p>
      The page you are looking for may have been moved, renamed, or no longer exists.
      You can return to the homepage or go back to the previous page.
    </p>
    <div class="actions">
      <a href="/" class="button button--primary">
        <i class="mdi mdi-home-outline" aria-hidden="true"></i>
        Back to home
      </a>
      <button type="button" class="button button--secondary" onclick="window.history.back()">
        <i class="mdi mdi-arrow-left" aria-hidden="true"></i>
        Go back
      </button>
    </div>
  </article>
</body>
</html>
