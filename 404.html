<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Nexas Studios</title>
  <meta name="description" content="The page you requested could not be found. Return to the Nexas Studios homepage.">
  <link rel="icon" type="image/png" href="logo-text-sqaure.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
  <style>
    :root {
      --bg: #06090e;
      --surface: rgba(13, 20, 32, 0.85);
      --border: rgba(148, 163, 184, 0.14);
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --cyan: #06b6d4;
      --cyan-glow: rgba(6, 182, 212, 0.2);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      --radius-lg: 24px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: var(--text-secondary);
      background: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(6, 182, 212, 0.15), transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(59, 130, 246, 0.08), transparent 70%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(580px, 100%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 44px 36px;
      text-align: center;
    }

    .logo {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      margin: 0 auto 20px;
      border: 1px solid var(--border);
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--cyan);
    }

    h1 {
      font-family: 'Sora', sans-serif;
      font-size: clamp(2rem, 5vw, 2.6rem);
      letter-spacing: -0.03em;
      color: var(--text-primary);
      margin-bottom: 14px;
    }

    p {
      margin: 0 auto 28px;
      max-width: 44ch;
      color: var(--text-muted);
      line-height: 1.65;
      font-size: 0.98rem;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      border-radius: 9999px;
      padding: 12px 24px;
      border: 0;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .button--primary {
      background: linear-gradient(135deg, #06b6d4 0%, #0284c7 100%);
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(6, 182, 212, 0.35);
    }

    .button--primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 26px rgba(6, 182, 212, 0.5);
    }

    .button--secondary {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
    }

    .button--secondary:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: var(--cyan);
      transform: translateY(-2px);
    }

    @media (max-width: 600px) {
      .card {
        padding: 32px 20px;
      }
      .button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <article class="card">
    <img class="logo" src="logo-3A4v6HJTGP8k26BXcVrTNrnjRUV.png" alt="Nexas Studios logo">
    <span class="eyebrow">404 Error</span>
    <h1>Page Not Found</h1>
    <p>
      The page you requested could not be located. Return to the Nexas Studios homepage or navigate back.
    </p>
    <div class="actions">
      <a href="/" class="button button--primary">
        <i class="mdi mdi-home-outline" aria-hidden="true"></i>
        <span>Back to Home</span>
      </a>
      <button type="button" class="button button--secondary" onclick="window.history.back()">
        <i class="mdi mdi-arrow-left" aria-hidden="true"></i>
        <span>Go Back</span>
      </button>
    </div>
  </article>
</body>
</html>
